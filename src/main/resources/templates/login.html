<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wiki Admin Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main class="page">
        <section class="card">
            <div class="brand-line">
                <div class="logo">W</div>
                <div>
                    <strong class="brand-name">Wiki</strong>
                    <span class="brand-subtitle">Knowledge Portal</span>
                </div>
            </div>

            <p class="status-label">Administrator Access</p>
            <h1>Sign in to your account</h1>
            <p class="subtitle">Enter your administrator credentials to continue.</p>

            <form th:action="@{/login}" th:object="${user}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input id="username"
                           type="text"
                           th:field="*{username}"
                           placeholder="Enter username"
                           autocomplete="username"
                           required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input id="password"
                           type="password"
                           th:field="*{password}"
                           placeholder="Enter password"
                           autocomplete="current-password"
                           required>
                </div>

                <button type="submit">Sign In</button>
            </form>

        </section>
    </main>

    <footer class="site-footer">
        BIT235 Assessment 2 - Part A · He Yichong · s1580500
    </footer>
</body>
</html>
