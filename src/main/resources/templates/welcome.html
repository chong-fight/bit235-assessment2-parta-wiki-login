<!DOCTYPE html>
<!--
  Name: He Yichong
  Student ID: s1580500
-->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Administrator welcome page for The Commons Wiki.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23151d18'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='38' font-style='italic' fill='%23f1e8d5'%3EC%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <title>Administrator Welcome | The Commons</title>
</head>
<body>
    <main class="status-shell">
        <section class="status-card" aria-labelledby="welcome-title">
            <div class="success-mark" aria-hidden="true">✓</div>
            <p class="form-kicker">Authentication successful</p>
            <h1 id="welcome-title">
                Welcome, <span th:text="${adminName}">He Yichong</span>.
            </h1>
            <p class="status-message">
                You have administrator access to The Commons knowledge archive.
            </p>

            <div class="status-details" aria-label="Signed-in account details">
                <div class="detail">
                    <span>Account role</span>
                    <strong>Wiki administrator</strong>
                </div>
                <div class="detail">
                    <span>Student ID</span>
                    <strong th:text="${studentId}">s1580500</strong>
                </div>
                <div class="detail">
                    <span>Signed in</span>
                    <strong th:text="${signedInAt}">23 Nov 2026, 16:00</strong>
                </div>
                <div class="detail">
                    <span>Access level</span>
                    <strong>Full administration</strong>
                </div>
            </div>

            <div class="status-actions">
                <a class="primary-button" th:href="@{/home}">Open the Wiki</a>
                <form th:action="@{/logout}" method="post">
                    <button class="secondary-button" type="submit">Sign out</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
