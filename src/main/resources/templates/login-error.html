<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Administrator login error for The Commons Wiki.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23151d18'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Georgia,serif' font-size='38' font-style='italic' fill='%23f1e8d5'%3EC%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <title>Login Failed | The Commons</title>
</head>
<body>
    <main class="status-shell">
        <section class="status-card" aria-labelledby="error-title">
            <p class="status-code">401</p>
            <h1 id="error-title">Access was not granted.</h1>
            <p class="status-message">
                The username or password did not match the administrator account.
                Check both values and try again.
            </p>

            <div class="status-actions">
                <a class="primary-button" th:href="@{/login}">Return to sign in</a>
            </div>
        </section>
    </main>
</body>
</html>
