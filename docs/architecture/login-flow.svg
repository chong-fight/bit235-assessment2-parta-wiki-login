<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#ba4b2b"/>
    </marker>
    <style>
      .title { font-family: Georgia, serif; font-size: 34px; fill: #151d18; }
      .subtitle { font-family: Segoe UI, sans-serif; font-size: 14px; fill: #5f685f; letter-spacing: 1.8px; }
      .box { fill: #fbf6e9; stroke: #263229; stroke-width: 1.5; }
      .box-dark { fill: #17231b; stroke: #17231b; stroke-width: 1.5; }
      .node-title { font-family: Georgia, serif; font-size: 22px; fill: #151d18; }
      .node-small { font-family: Segoe UI, sans-serif; font-size: 13px; fill: #586259; }
      .dark-title { fill: #f1e8d5; }
      .dark-small { fill: #bfc8bb; }
      .flow { fill: none; stroke: #ba4b2b; stroke-width: 2; }
      .label { font-family: Segoe UI, sans-serif; font-size: 12px; font-weight: 600; fill: #87361f; }
      .decision { fill: #f1e8d5; stroke: #ba4b2b; stroke-width: 1.5; }
      .footer { font-family: Segoe UI, sans-serif; font-size: 11px; fill: #6a746b; }
    </style>
  </defs>

  <rect width="1200" height="740" fill="#eee4d0"/>
  <text x="62" y="66" class="subtitle">BIT235 · ASSESSMENT 2 PART A</text>
  <text x="62" y="112" class="title">Administrator login request flow</text>
  <line x1="62" y1="136" x2="1138" y2="136" stroke="#b7aa91"/>

  <rect class="box" x="62" y="205" width="205" height="112" rx="3"/>
  <text x="86" y="245" class="node-title">Browser</text>
  <text x="86" y="276" class="node-small">GET /login</text>
  <text x="86" y="298" class="node-small">POST /login</text>

  <rect class="box-dark" x="337" y="180" width="250" height="162" rx="3"/>
  <text x="365" y="220" class="node-title dark-title">LoginController</text>
  <text x="365" y="251" class="node-small dark-small">@Controller</text>
  <text x="365" y="274" class="node-small dark-small">@GetMapping("/login")</text>
  <text x="365" y="297" class="node-small dark-small">@PostMapping("/login")</text>
  <text x="365" y="320" class="node-small dark-small">Manages the session</text>

  <rect class="box" x="657" y="180" width="245" height="162" rx="3"/>
  <text x="684" y="220" class="node-title">AuthenticationService</text>
  <text x="684" y="251" class="node-small">@Service</text>
  <text x="684" y="274" class="node-small">Compares username</text>
  <text x="684" y="297" class="node-small">and password</text>

  <rect class="box" x="950" y="180" width="188" height="162" rx="3"/>
  <text x="974" y="216" class="node-title">AdminUser</text>
  <text x="974" y="242" class="node-title">Repository</text>
  <text x="974" y="274" class="node-small">@Repository</text>
  <text x="974" y="297" class="node-small">Hard-coded account</text>
  <text x="974" y="320" class="node-small">he / 123</text>

  <path class="flow" marker-end="url(#arrow)" d="M267 261 C294 261 308 261 337 261"/>
  <text x="279" y="247" class="label">request</text>
  <path class="flow" marker-end="url(#arrow)" d="M587 261 C620 261 624 261 657 261"/>
  <text x="600" y="247" class="label">validate</text>
  <path class="flow" marker-end="url(#arrow)" d="M902 261 C920 261 932 261 950 261"/>
  <text x="912" y="247" class="label">lookup</text>

  <path class="flow" d="M1050 342 L1050 390 L600 390 L600 418" marker-end="url(#arrow)"/>
  <text x="742" y="378" class="label">matching result</text>

  <polygon class="decision" points="600,418 712,472 600,526 488,472"/>
  <text x="559" y="467" class="node-title">Credentials</text>
  <text x="568" y="491" class="node-title">match?</text>

  <path class="flow" marker-end="url(#arrow)" d="M488 472 C420 472 350 520 260 555"/>
  <text x="354" y="458" class="label">NO</text>

  <path class="flow" marker-end="url(#arrow)" d="M712 472 C810 472 930 510 1005 555"/>
  <text x="803" y="458" class="label">YES</text>

  <rect class="box" x="62" y="555" width="260" height="72" rx="3"/>
  <text x="85" y="585" class="node-title">login-error.html</text>
  <text x="85" y="608" class="node-small">Generic failure message</text>

  <rect class="box-dark" x="872" y="555" width="266" height="130" rx="3"/>
  <text x="894" y="590" class="node-title dark-title">welcome.html</text>
  <text x="894" y="617" class="node-small dark-small">Thymeleaf success view</text>
  <text x="894" y="640" class="node-small dark-small">Creates an admin session</text>
  <text x="894" y="663" class="node-small dark-small">Shows administrator name</text>

  <text x="365" y="604" class="node-small">GET /login renders login.html</text>
  <text x="365" y="626" class="node-small">The browser retries after an error.</text>

  <text x="62" y="718" class="footer">MVC separation: View · Controller · Service · Repository · Model</text>
  <text x="927" y="718" class="footer">He Yichong · s1580500</text>
</svg>
